<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Global SAS 2023/24</title>
    <style>
        :root { --sas-primary: #007d43; --sas-secondary: #004d2a; --bg: #f0f4f8; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .main-container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 3px solid var(--sas-primary); padding-bottom: 15px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        select, input { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 16px; background: var(--sas-primary); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button:hover { background: var(--sas-secondary); transform: scale(1.01); }
        
        #progress { margin: 20px 0; display: none; text-align: center; }
        .bar-bg { background: #e9ecef; border-radius: 10px; height: 12px; overflow: hidden; }
        .bar-fill { background: var(--sas-primary); width: 0%; height: 100%; transition: width 0.3s; }
        
        .result-card { border: 1px solid #dee2e6; padding: 20px; margin-top: 15px; border-radius: 15px; background: #fff; border-left: 10px solid #ddd; }
        .result-card.principal { border-left-color: #28a745; }
        .result-card.adicional { border-left-color: #17a2b8; }
        .badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        .badge-p { background: #d4edda; color: #155724; }
        .badge-a { background: #d1ecf1; color: #0c5460; }
        .name { font-size: 18px; font-weight: bold; }
        .nota-box { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; }
        .nota-num { font-size: 32px; font-weight: 800; color: #2c3e50; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header">
        <h1>Buscador de Listados SAS</h1>
        <small>Actualización según Cuadro de Evolución 2023</small>
    </div>

    <div class="form-group">
        <label>Categoría Profesional</label>
        <select id="categoria">
            <option value="1004">Celador Conductor</option>
            <option value="1003">Celador</option>
            <option value="1001">Enfermero/a</option>
            <option value="1011">TCAE (Auxiliar de Enfermería)</option>
            <option value="1013">Auxiliar Administrativo</option>
            <option value="1005">Administrativo</option>
            <option value="1002">Fisioterapeuta</option>
            <option value="1021">Técnico Superior Laboratorio</option>
            <option value="1022">Técnico Superior Radiodiagnóstico</option>
            <option value="1044">Cocinero/a</option>
            <option value="1055">Limpiador/a</option>
            <option value="1040">Trabajador/a Social</option>
            <option value="1020">Técnico Superior Anatomía Patológica</option>
        </select>
    </div>

    <div class="form-group">
        <label>Apellidos del Aspirante</label>
        <input type="text" id="apellidos" placeholder="Escribe los apellidos a buscar...">
    </div>

    <button onclick="realizarBusqueda()">Escanear Registros Oficiales</button>

    <div id="progress">
        <div class="bar-bg"><div class="bar-fill" id="fill"></div></div>
        <p id="p-text" style="font-size: 12px; margin-top: 8px; color: #666;">Preparando conexión...</p>
    </div>

    <div id="results"></div>
</div>

<script>
async function realizarBusqueda() {
    const catId = document.getElementById('categoria').value;
    const apellidos = document.getElementById('apellidos').value.trim().toLowerCase();
    const resultsArea = document.getElementById('results');
    const fill = document.getElementById('fill');
    const prog = document.getElementById('progress');

    if(!apellidos) return alert("Introduce los apellidos");

    resultsArea.innerHTML = "";
    prog.style.display = "block";
    let encontrados = [];
    const pagsTotal = 80;

    async function fetchPagina(num, situacion) {
        try {
            // Genera la URL dinámica basada en el ID de categoría y tipo de bolsa
            const baseUrl = `https://ws027.sspa.juntadeandalucia.es/profesionales/personaltemporal/bdf_listado_inscripcion.asp?id_catesp=${catId}&situacion=${situacion}&provisional=0&convocatoria=2023&pageno=${num}`;
            const proxy = "https://corsproxy.io/?";
            
            const res = await fetch(proxy + encodeURIComponent(baseUrl));
            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, "text/html");

            doc.querySelectorAll("table tr").forEach(row => {
                const c = row.querySelectorAll("td");
                if(c.length > 6) {
                    const nombre = c[1].innerText.trim();
                    if(nombre.toLowerCase().includes(apellidos)) {
                        encontrados.push({
                            nombre: nombre,
                            dni: c[0].innerText.trim(),
                            nota: c[6].innerText.trim(),
                            tipo: situacion === 'A' ? 'Bolsa Principal' : 'Bolsa Adicional'
                        });
                    }
                }
            });
        } catch(e) {}
    }

    // Busqueda concurrente en bloques de 15 para máxima velocidad
    for(let i=1; i <= pagsTotal; i += 15) {
        let lotes = [];
        for(let j=i; j < i+15; j++) {
            lotes.push(fetchPagina(j, 'A')); // Busca en principal
            lotes.push(fetchPagina(j, 'X')); // Busca en adicional
        }
        await Promise.all(lotes);
        let porc = Math.floor((i/pagsTotal)*100);
        fill.style.width = porc + "%";
        document.getElementById('p-text').innerText = `Analizando página ${i} de ${pagsTotal}...`;
    }

    prog.style.display = "none";

    if(encontrados.length === 0) {
        resultsArea.innerHTML = "<p style='text-align:center; padding:20px;'>No se encontraron registros en los listados actuales.</p>";
        return;
    }

    resultsArea.innerHTML = encontrados.map(r => `
        <div class="result-card ${r.tipo === 'Bolsa Principal' ? 'principal' : 'adicional'}">
            <span class="badge ${r.tipo === 'Bolsa Principal' ? 'badge-p' : 'badge-a'}">${r.tipo}</span>
            <div class="name">${r.nombre}</div>
            <div style="font-size: 13px; color: #888;">DNI: ${r.dni}</div>
            <div class="nota-box">
                <span class="nota-num">${r.nota}</span>
                <span style="font-size: 12px; color: #999; font-weight: bold;">PUNTOS</span>
            </div>
        </div>
    `).join("");
}
</script>

</body>
</html>
