<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAS BUSCADOR Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2ecc71;
            --primary-dark: #27ae60;
            --bg: #f8fafc;
            --text: #1e293b;
            --danger: #ef4444;
            --info: #3b82f6;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            background: var(--bg); 
            color: var(--text);
            line-height: 1.5;
        }

        .header { 
            background: var(--primary); 
            color: white; 
            padding: 40px 20px; 
            text-align: center; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .header h1 { margin: 0; font-size: 28px; font-weight: 700; }
        .header p { margin: 5px 0 0; opacity: 0.9; font-size: 16px; }

        .container { max-width: 600px; margin: -30px auto 40px; padding: 0 20px; }

        .search-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        input { 
            width: 100%; 
            padding: 12px 16px; 
            margin: 8px 0; 
            border-radius: 10px; 
            border: 1px solid #e2e8f0; 
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus { outline: none; border-color: var(--primary); ring: 2px var(--primary); }

        button { 
            width: 100%; 
            padding: 14px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: 600;
            margin-top: 15px; 
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        button:hover { background: var(--primary-dark); }
        button:active { transform: scale(0.98); }

        /* Progreso */
        #progress-container { margin-top: 20px; display: none; }
        .progress-bar-bg { background: #e2e8f0; border-radius: 20px; height: 10px; overflow: hidden; }
        #progress-bar { 
            background: var(--primary); 
            width: 0%; 
            height: 100%; 
            transition: width 0.3s ease; 
        }
        #progress-text { font-size: 12px; text-align: center; margin-top: 5px; color: #64748b; }

        /* Resultados */
        .card { 
            background: white; 
            padding: 20px; 
            margin-top: 15px; 
            border-radius: 12px; 
            border-left: 5px solid #cbd5e1;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card.aprobado { border-left-color: var(--primary); }
        .card.adicional { border-left-color: var(--info); }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .badge-bolsa { background: #dcfce7; color: #166534; }
        .badge-extra { background: #dbeafe; color: #1e40af; }

        .nota-valor { font-size: 24px; font-weight: 700; color: var(--text); }
        .error-msg { color: var(--danger); text-align: center; margin-top: 20px; font-weight: 600; }
    </style>
</head>
<body>

<div class="header">
    <h1>SAS BUSCADOR</h1>
    <p>Categoría: Celador Conductor</p>
</div>

<div class="container">
    <div class="search-card">
        <input id="apellidos" placeholder="Apellidos (obligatorio)">
        <input id="nombre" placeholder="Nombre (opcional)">
        <input id="dni" placeholder="DNI (opcional)">
        <button onclick="buscar()">Iniciar Búsqueda</button>

        <div id="progress-container">
            <div class="progress-bar-bg">
                <div id="progress-bar"></div>
            </div>
            <div id="progress-text">Procesando... 0%</div>
        </div>
    </div>

    <div id="results"></div>
</div>

<script>
async function buscar() {
    const apellidos = document.getElementById("apellidos").value.trim().toLowerCase();
    const nombre = document.getElementById("nombre").value.trim().toLowerCase();
    const dniBuscar = document.getElementById("dni").value.trim().toLowerCase();
    const resultsDiv = document.getElementById("results");
    const progressContainer = document.getElementById("progress-container");
    const progressBar = document.getElementById("progress-bar");
    const progressText = document.getElementById("progress-text");

    if (!apellidos) {
        resultsDiv.innerHTML = "<p class='error-msg'>Por favor, introduce los apellidos.</p>";
        return;
    }

    // Reset de UI
    resultsDiv.innerHTML = "";
    progressContainer.style.display = "block";
    let resultados = [];
    let adicional = {};
    
    const paginasBolsa = 52;
    const paginasExtra = 91;
    const totalPaginas = paginasBolsa + paginasExtra;
    let procesadas = 0;

    const actualizarProgreso = () => {
        procesadas++;
        let porcentaje = Math.floor((procesadas / totalPaginas) * 100);
        progressBar.style.width = porcentaje + "%";
        progressText.innerHTML = `Escaneando base de datos SAS: ${porcentaje}%`;
    };

    // Función de comparación optimizada
    const coincide = (nombreC, dni) => {
        const txt = nombreC.toLowerCase();
        if (!txt.includes(apellidos)) return false;
        if (nombre && !txt.includes(nombre)) return false;
        if (dniBuscar && !dni.toLowerCase().includes(dniBuscar)) return false;
        return true;
    };

    async function scrap(url, tipo) {
        try {
            const proxy = "https://corsproxy.io/?";
            const res = await fetch(proxy + encodeURIComponent(url));
            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, "text/html");

            doc.querySelectorAll("table tr").forEach(row => {
                const c = row.querySelectorAll("td");
                if (tipo === "bolsa" && c.length > 6) {
                    const dni = c[0].innerText.trim();
                    const nombreC = c[1].innerText.trim();
                    const nota = c[6].innerText.trim();
                    if (coincide(nombreC, dni)) {
                        resultados.push({ nombre: nombreC, dni, nota });
                    }
                }
                if (tipo === "extra" && c.length >= 5) {
                    const dni = c[0].innerText.trim();
                    let nota = c[4].innerText.trim();
                    if (dni && nota && !isNaN(parseFloat(nota.replace(",",".")))) {
                        adicional[dni] = nota;
                    }
                }
            });
        } catch (e) { console.error("Error en página", url); }
        actualizarProgreso();
    }

    // Ejecución por lotes para mayor velocidad y estabilidad
    const urls = [];
    for (let i = 1; i <= paginasBolsa; i++) {
        urls.push({ url: `https://ws027.sspa.juntadeandalucia.es/profesionales/personaltemporal/bdf_listado_inscripcion.asp?c_area_esp=000&id_catesp=1004&estado=listado&provisional=0&situacion=A&orden=ORDNOTA&t=L&convocatoria=2023&pageno=${i}`, tipo: "bolsa" });
    }
    for (let i = 1; i <= paginasExtra; i++) {
        urls.push({ url: `https://ws027.sspa.juntadeandalucia.es/profesionales/personaltemporal/bdf_listado_inscripcion.asp?c_area_esp=000&id_catesp=1004&estado=listado&provisional=0&situacion=X&pageno=${i}&orden=ORDNOTA&t=L&convocatoria=2023`, tipo: "extra" });
    }

    // Procesar en grupos de 10 para no saturar el navegador
    const chunkSize = 10;
    for (let i = 0; i < urls.length; i += chunkSize) {
        const chunk = urls.slice(i, i + chunkSize);
        await Promise.all(chunk.map(u => scrap(u.url, u.tipo)));
    }

    // Pintado Final
    progressContainer.style.display = "none";
    if (resultados.length === 0) {
        resultsDiv.innerHTML = "<p class='error-msg'>No se encontraron resultados con esos datos.</p>";
        return;
    }

    resultsDiv.innerHTML = resultados.map(r => {
        const notaNum = parseFloat(r.nota.replace(",", "."));
        const esBolsaNormal = notaNum >= 40;
        const notaExtra = adicional[r.dni];
        
        return `
            <div class="card ${esBolsaNormal ? 'aprobado' : 'adicional'}">
                <span class="badge ${esBolsaNormal ? 'badge-bolsa' : 'badge-extra'}">
                    ${esBolsaNormal ? 'Bolsa Principal' : 'Bolsa Adicional'}
                </span>
                <div style="font-weight:700; font-size:18px;">${r.nombre}</div>
                <div style="color:#64748b; font-size:14px; margin-bottom:10px;">DNI: ${r.dni}</div>
                <div style="display:flex; justify-content: space-between; align-items:center;">
                    <div>
                        <div style="font-size:12px; color:#64748b;">Nota Bolsa</div>
                        <div class="nota-valor">${r.nota}</div>
                    </div>
                    ${notaExtra ? `
                    <div style="text-align:right;">
                        <div style="font-size:12px; color:#64748b;">Nota Adicional</div>
                        <div class="nota-valor" style="color:var(--info)">${notaExtra}</div>
                    </div>` : ''}
                </div>
            </div>
        `;
    }).join("");
}
</script>

</body>
</html>
