<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Maestro SAS 2023</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --sas-green: #00a859; --sas-blue: #007bff; --sas-red: #dc3545; --bg: #f4f7f6; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--sas-green); font-weight: 900; margin-bottom: 5px; }
        .search-box { background: #e9ecef; padding: 20px; border-radius: 15px; margin-bottom: 25px; }
        input { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 18px; box-sizing: border-box; }
        button { width: 100%; padding: 18px; background: var(--sas-green); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        
        #status { margin: 20px 0; display: none; text-align: center; }
        .bar-bg { background: #ddd; height: 10px; border-radius: 5px; overflow: hidden; }
        #bar-fill { background: var(--sas-green); width: 0%; height: 100%; transition: width 0.2s; }
        
        .result-card { border: 1px solid #eee; padding: 20px; margin-top: 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; border-left: 8px solid #ccc; }
        .card-libre { border-left-color: var(--sas-green); }
        .card-promo { border-left-color: #f39c12; }
        .card-disc { border-left-color: #9b59b6; }
        .card-extra { border-left-color: var(--sas-blue); border-left-style: dashed; }

        .cat-tag { font-size: 11px; font-weight: 900; text-transform: uppercase; color: #666; }
        .candidate-name { font-size: 18px; font-weight: 700; margin: 5px 0; }
        .nota-box { text-align: right; }
        .nota-val { font-size: 30px; font-weight: 900; color: #2c3e50; }
        .badge { padding: 4px 8px; border-radius: 5px; font-size: 10px; font-weight: bold; margin-right: 5px; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>SISTEMA DE LOCALIZACIÓN SAS</h1>
    <p style="text-align:center; color:#666;">Escaneo global de todas las categorías y turnos</p>

    <div class="search-box">
        <input type="text" id="apellidos" placeholder="Introduce APELLIDOS del candidato...">
        <button onclick="escanear()">INICIAR BÚSQUEDA GLOBAL</button>
    </div>

    <div id="status">
        <div class="bar-bg"><div id="bar-fill"></div></div>
        <p id="status-txt" style="font-size:12px; margin-top:5px;">Iniciando...</p>
    </div>

    <div id="results"></div>
</div>

<script>
// Base de datos extendida con IDs clave (se pueden seguir añadiendo según el enlace oficial)
const dbCategorias = [
    {id: "1004", n: "Celador Conductor"}, {id: "1003", n: "Celador"},
    {id: "1001", n: "Enfermero/a"}, {id: "1011", n: "TCAE"},
    {id: "1013", n: "Aux. Administrativo"}, {id: "1005", n: "Administrativo"},
    {id: "5003", n: "FEA Alergología"}, {id: "5043", n: "FEA Obstetricia y Ginecología"},
    {id: "1044", n: "Cocinero/a"}, {id: "1040", n: "Trabajador/a Social"},
    {id: "1002", n: "Fisioterapeuta"}, {id: "1055", n: "Limpiador/a"}
    // Nota: El sistema funciona añadiendo los IDs numéricos que aparecen en tus enlaces.
];

async function escanear() {
    const ape = document.getElementById('apellidos').value.trim().toLowerCase();
    const resDiv = document.getElementById('results');
    const fill = document.getElementById('bar-fill');
    const status = document.getElementById('status');
    
    if(!ape) return alert("Apellidos obligatorios");

    resDiv.innerHTML = "";
    status.style.display = "block";
    let encontrados = [];

    const fetchData = async (cat, turno, situacion) => {
        try {
            // Construcción de URL según tus especificaciones (Situación A=Normal, X=Adicional | T=Turno)
            const url = `https://ws027.sspa.juntadeandalucia.es/profesionales/personaltemporal/bdf_listado_inscripcion.asp?id_catesp=${cat.id}&situacion=${situacion}&provisional=0&t=${turno}&convocatoria=2023&pageno=1`;
            const proxy = "https://corsproxy.io/?";
            const response = await fetch(proxy + encodeURIComponent(url));
            const html = await response.text();
            const doc = new DOMParser().parseFromString(html, "text/html");

            doc.querySelectorAll("table tr").forEach(row => {
                const c = row.querySelectorAll("td");
                if(c.length > 6) {
                    const nombre = c[1].innerText.trim();
                    if(nombre.toLowerCase().includes(ape)) {
                        encontrados.push({
                            cat: cat.n, nombre, dni: c[0].innerText.trim(),
                            nota: c[6].innerText.trim(),
                            turno: turno === 'L' ? 'Libre' : (turno === 'P' ? 'Promo. Interna' : 'Discapacidad'),
                            tipo: situacion === 'A' ? 'Principal' : 'Adicional'
                        });
                    }
                }
            });
        } catch(e) {}
    };

    // Escaneo masivo: Recorremos categorías y dentro de cada una, los 3 turnos y 2 tipos de bolsa
    for(let i=0; i < dbCategorias.length; i++) {
        const cat = dbCategorias[i];
        document.getElementById('status-txt').innerText = `Escaneando: ${cat.n}...`;
        fill.style.width = ((i+1)/dbCategorias.length)*100 + "%";

        // Lanzamos búsquedas en paralelo para no tardar una eternidad
        await Promise.all([
            fetchData(cat, 'L', 'A'), fetchData(cat, 'P', 'A'), fetchData(cat, 'D', 'A'), // Normales
            fetchData(cat, 'L', 'X'), fetchData(cat, 'P', 'X'), fetchData(cat, 'D', 'X')  // Adicionales
        ]);
    }

    status.style.display = "none";
    if(encontrados.length === 0) {
        resDiv.innerHTML = "<p style='text-align:center;'>No se han encontrado registros.</p>";
        return;
    }

    resDiv.innerHTML = encontrados.map(r => `
        <div class="result-card ${r.tipo === 'Adicional' ? 'card-extra' : (r.turno === 'Libre' ? 'card-libre' : (r.turno === 'Discapacidad' ? 'card-disc' : 'card-promo'))}">
            <div>
                <div class="cat-tag">${r.cat}</div>
                <div class="candidate-name">${r.nombre}</div>
                <div style="font-size:12px; color:#888;">DNI: ${r.dni}</div>
                <div style="margin-top:8px;">
                    <span class="badge" style="background:#444">${r.turno}</span>
                    <span class="badge" style="background:${r.tipo==='Principal'?'#28a745':'#007bff'}">${r.tipo}</span>
                </div>
            </div>
            <div class="nota-box">
                <div class="nota-val">${r.nota}</div>
                <div style="font-size:10px; font-weight:bold; color:#999;">PUNTOS</div>
            </div>
        </div>
    `).join("");
}
</script>
</body>
</html>
